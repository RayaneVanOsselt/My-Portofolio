<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — RVO · Rayane Van Osselt</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="https://rayanevanosselt.github.io/My-Portofolio/favicon.ico" sizes="32x32 48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@200..700&display=swap">
  <style>
    :root { --ink: #fff; --ash: #9a9a9a; --spark: #ffb829; --iris: #6a5cff; }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #000; color: var(--ink); font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 48px 20px; }
    main { width: min(100%, 960px); }
    img { display: block; width: min(220px, 60vw); height: auto; margin-bottom: 56px; }
    .code { font: 500 12px/1.4 "Geist Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--spark); margin: 0 0 20px; }
    h1 { font-weight: 400; font-size: clamp(44px, 9vw, 104px); line-height: .95; letter-spacing: -.045em; margin: 0 0 48px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    li p { margin: 0 0 12px; color: var(--ash); font-weight: 300; line-height: 1.5; }
    a { color: var(--ink); text-underline-offset: .25em; text-decoration-thickness: 1px; }
    a:hover { color: var(--spark); }
    a:focus-visible { outline: 2px solid var(--spark); outline-offset: 4px; border-radius: 4px; }
    .lang { font: 500 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--ash); letter-spacing: .12em; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <main>
    <img src="https://rayanevanosselt.github.io/My-Portofolio/assets/img/brand/rvo-mark.png" width="342" height="128" alt="RVO">
    <p class="code">Erreur 404 · Error 404 · Fout 404</p>
    <h1>Page introuvable.</h1>
    <ul>
      <li lang="fr">
        <span class="lang">fr</span>
        <p>Cette page n’existe pas ou a été déplacée.</p>
        <a href="https://rayanevanosselt.github.io/My-Portofolio/">Retour à l’accueil</a>
      </li>
      <li lang="en">
        <span class="lang">en</span>
        <p>This page doesn’t exist or has been moved.</p>
        <a href="https://rayanevanosselt.github.io/My-Portofolio/en/">Back to home</a>
      </li>
      <li lang="nl">
        <span class="lang">nl</span>
        <p>Deze pagina bestaat niet of werd verplaatst.</p>
        <a href="https://rayanevanosselt.github.io/My-Portofolio/nl/">Terug naar de homepage</a>
      </li>
      
    </ul>
  </main>
</body>
</html>
